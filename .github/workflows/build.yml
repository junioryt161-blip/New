name: Build Friday APK
on: { workflow_dispatch: {}, push: { branches: [main, master] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Download voice models
        run: |
          A=app/src/main/assets
          rm -rf $A/model-en $A/model-spk
          curl -L -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          curl -L -o spk.zip https://alphacephei.com/vosk/models/vosk-model-spk-0.4.zip
          unzip -q en.zip -d tmp && mv tmp/vosk-model-small-en-in-0.4 $A/model-en
          unzip -q spk.zip -d tmp && mv tmp/vosk-model-spk-0.4 $A/model-spk
          uuidgen > $A/model-en/uuid; uuidgen > $A/model-spk/uuid
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: Friday-APK, path: app/build/outputs/apk/debug/app-debug.apk }
